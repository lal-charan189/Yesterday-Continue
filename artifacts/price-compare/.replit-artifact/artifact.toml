kind = "web"
previewPath = "/"
title = "PriceHunt - Price Comparison"
version = "1.0.0"
id = "artifacts/price-compare"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23093

[services.development]
run = "pnpm --filter @workspace/price-compare run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/price-compare", "run", "build" ]
publicDir = "artifacts/price-compare/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23093"
BASE_PATH = "/"
